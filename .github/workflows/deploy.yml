name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Inject DeepSeek API Key
        run: |
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "VITE_DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env.production
            echo "API key injected from GitHub Secret"
          else
            echo "No DEEPSEEK_API_KEY secret found, using obfuscated fallback"
          fi

      - name: Build H5
        run: npm run build:h5

      - name: Copy legacy games
        run: cp -r legacy dist/build/h5/legacy

      - name: Copy CNAME (custom domain)
        run: cp CNAME dist/build/h5/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/build/h5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
