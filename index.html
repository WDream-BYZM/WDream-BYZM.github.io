<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>俄罗斯方块</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f33 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Courier New', monospace;
    }

    .game-container {
      background: #101624;
      padding: 1.5rem 2.5rem;
      border-radius: 2.5rem;
      box-shadow: 0 25px 35px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      backdrop-filter: blur(2px);
    }

    .play-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas#boardCanvas {
      display: block;
      width: 300px;
      height: 600px;
      border-radius: 18px;
      background-color: #0c0f18;
      box-shadow: inset 0 0 20px #00000066, 0 10px 0 #080b10, 0 0 0 2px #2f354a;
      image-rendering: crisp-edges;
    }

    .info-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      min-width: 140px;
    }

    .next-container {
      background: #0c0f18;
      padding: 1.2rem 0.8rem 1rem 0.8rem;
      border-radius: 24px;
      box-shadow: inset 0 3px 8px #000000, 0 8px 0 #080b10, 0 0 0 2px #2f354a;
      text-align: center;
    }

    .next-title {
      color: #b7c9e2;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 3px;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      text-shadow: 0 2px 3px black;
    }

    canvas#nextCanvas {
      display: block;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      background-color: #0a0d14;
      border-radius: 12px;
      box-shadow: inset 0 0 8px #000000;
      image-rendering: crisp-edges;
    }

    .score-box {
      background: #0c0f18;
      padding: 1rem 1.8rem;
      border-radius: 40px;
      box-shadow: inset 0 2px 6px #000000, 0 6px 0 #080b10, 0 0 0 2px #2f354a;
      width: 100%;
      text-align: center;
    }

    .score-label {
      color: #8f9eb5;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    #scoreValue {
      color: #f2e982;
      font-size: 2.8rem;
      font-weight: 800;
      display: block;
      line-height: 1.2;
      text-shadow: 0 0 12px #f5d65488;
      font-family: 'Courier New', monospace;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0.5rem;
    }

    .restart-btn {
      background: #20273e;
      border: none;
      border-bottom: 5px solid #080b10;
      color: #dfe7f5;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f131c, 0 0 0 1px #3e465e;
      transition: all 0.08s;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: inherit;
    }

    .restart-btn:hover {
      background: #2f3a58;
      color: white;
      border-bottom-width: 3px;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f131c, 0 0 0 1px #5b6a8a;
    }

    .restart-btn:active {
      transform: translateY(5px);
      border-bottom-width: 1px;
      background: #1b2338;
    }

    .tip {
      color: #7a89aa;
      font-size: 0.8rem;
      margin-top: 12px;
      text-align: center;
    }

    .tip kbd {
      background: #232a3f;
      border-radius: 6px;
      padding: 2px 8px;
      color: #d3defa;
      font-weight: bold;
      border-bottom: 2px solid #0b0f17;
      margin: 0 2px;
    }
    
    /* 暂停指示器微光 */
    .pause-badge {
      display: inline-block;
      margin-left: 12px;
      background: #f39c12;
      color: #1e1f2c;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 30px;
      letter-spacing: 1px;
      vertical-align: middle;
      box-shadow: 0 0 5px #f5b042;
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="play-area">
    <canvas id="boardCanvas" width="300" height="600"></canvas>
  </div>

  <div class="info-panel">
    <div class="next-container">
      <div class="next-title">▶ 下一个</div>
      <canvas id="nextCanvas" width="120" height="120"></canvas>
    </div>
    <div class="score-box">
      <span class="score-label">得分</span>
      <span id="scoreValue">0</span>
    </div>
    <div class="controls">
      <button class="restart-btn" id="restartButton">↻ 开始</button>
      <div class="tip">
        <kbd>←</kbd> <kbd>→</kbd> <kbd>↓</kbd> <kbd>↑</kbd> 旋转<br>
        <kbd>空格</kbd> 硬降到底 &nbsp;&nbsp; <kbd>ESC</kbd> / <kbd>空格</kbd> 暂停
      </div>
    </div>
  </div>
</div>
<script>
  (function(){
    "use strict";

    // ---------- 配置 ----------
    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 30;
    const PREVIEW_SIZE = 24;

    const boardCanvas = document.getElementById('boardCanvas');
    const ctx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreValue');

    // ---------- 状态 ----------
    let board = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let gameOver = false;
    let gameLoopInterval = null;
    const BASE_INTERVAL = 450;
    
    // ----- 新增暂停状态 -----
    let paused = false;          // 全局暂停标志
    let pausePending = false;    // 辅助防止多次切换时事件重叠

    // 七种方块
    const PIECES = [
      { shape: [[1,1,1,1]], color: '#3ec1d3' },      // I
      { shape: [[1,1],[1,1]], color: '#f6d365' },    // O
      { shape: [[0,1,0],[1,1,1]], color: '#b286fe' }, // T
      { shape: [[0,1,1],[1,1,0]], color: '#5fdd9d' }, // S
      { shape: [[1,1,0],[0,1,1]], color: '#ff9a76' }, // Z
      { shape: [[1,0,0],[1,1,1]], color: '#f9b572' }, // L
      { shape: [[0,0,1],[1,1,1]], color: '#7aa5f5' }  // J
    ];

    // ---------- 辅助函数 ----------
    function createEmptyBoard() {
      return Array(ROWS).fill().map(() => Array(COLS).fill(0));
    }

    function getRandomPiece() {
      const idx = Math.floor(Math.random() * PIECES.length);
      const piece = PIECES[idx];
      return {
        shape: piece.shape.map(row => [...row]),
        color: piece.color
      };
    }

    // 停止游戏循环 (清计时器)
    function stopGameLoop() {
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }
    }
    
    // 启动游戏循环 (若未结束且未暂停)
    function startLoopIfNeeded() {
      if (gameLoopInterval) stopGameLoop();
      if (!gameOver && !paused) {
        gameLoopInterval = setInterval(gameTick, BASE_INTERVAL);
      } else {
        gameLoopInterval = null;
      }
    }
    
    // 统一的暂停切换函数 (供键盘调用)
    function togglePause() {
      if (gameOver) return;      // 游戏结束不能暂停
      if (pausePending) return;
      pausePending = true;
      
      paused = !paused;
      
      if (paused) {
        // 暂停: 清除下落时钟，并且重新绘制一下画面显示暂停遮罩（在原drawBoard基础上增加暂停提示）
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
      } else {
        // 恢复: 重启时钟 (前提是游戏未结束)
        if (!gameOver) {
          if (gameLoopInterval) clearInterval(gameLoopInterval);
          gameLoopInterval = setInterval(gameTick, BASE_INTERVAL);
        }
      }
      // 刷新画面 (显示暂停文字/恢复)
      drawAll();
      pausePending = false;
    }
    
    // 重置游戏时强制重置暂停状态
    function resetPauseState() {
      if (paused) {
        paused = false;
      }
      pausePending = false;
    }
    
    function initGame() {
      // 重置暂停相关标志
      resetPauseState();
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }
      board = createEmptyBoard();
      nextPiece = getRandomPiece();
      spawnNewPiece();
      score = 0;
      gameOver = false;
      paused = false;    // 新游戏强制非暂停
      updateScoreDisplay();
      drawAll();
      // 重新启动循环 (仅当未暂停且未结束时)
      if (!gameOver && !paused) {
        gameLoopInterval = setInterval(gameTick, BASE_INTERVAL);
      }
    }

    function spawnNewPiece() {
      if (!nextPiece) {
        nextPiece = getRandomPiece();
      }
      const newShape = nextPiece.shape.map(row => [...row]);
      currentPiece = {
        shape: newShape,
        color: nextPiece.color,
        x: Math.floor((COLS - newShape[0].length) / 2),
        y: 0
      };
      nextPiece = getRandomPiece();

      if (collision(currentPiece.shape, currentPiece.x, currentPiece.y)) {
        gameOver = true;
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
      }
    }

    function collision(shape, offsetX, offsetY) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
          if (shape[r][c] !== 0) {
            const boardRow = offsetY + r;
            const boardCol = offsetX + c;
            if (boardRow < 0 || boardRow >= ROWS || boardCol < 0 || boardCol >= COLS) {
              return true;
            }
            if (boardRow >= 0 && board[boardRow][boardCol] !== 0) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // 幽灵位置
    function getGhostY() {
      if (!currentPiece) return 0;
      let y = currentPiece.y;
      while (!collision(currentPiece.shape, currentPiece.x, y + 1)) {
        y++;
      }
      return y;
    }

    function lockPiece() {
      const { shape, x, y, color } = currentPiece;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
          if (shape[r][c] !== 0) {
            const boardRow = y + r;
            const boardCol = x + c;
            if (boardRow >= 0 && boardRow < ROWS && boardCol >= 0 && boardCol < COLS) {
              board[boardRow][boardCol] = color;
            }
          }
        }
      }

      clearFullRows();
      spawnNewPiece();

      if (gameOver) {
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
      }
    }

    function clearFullRows() {
      let rowsCleared = 0;
      for (let row = ROWS - 1; row >= 0; ) {
        if (board[row].every(cell => cell !== 0)) {
          board.splice(row, 1);
          board.unshift(Array(COLS).fill(0));
          rowsCleared++;
        } else {
          row--;
        }
      }

      if (rowsCleared > 0) {
        const points = [0, 100, 300, 600, 1000];
        const addScore = points[rowsCleared] || 1500;
        score += addScore;
        updateScoreDisplay();
      }
    }

    function updateScoreDisplay() {
      scoreSpan.textContent = score;
    }

    // ---------- 移动操作 (若暂停则无效) ----------
    function movePiece(dx, dy) {
      if (paused || gameOver || !currentPiece) return false;
      const newX = currentPiece.x + dx;
      const newY = currentPiece.y + dy;
      if (!collision(currentPiece.shape, newX, newY)) {
        currentPiece.x = newX;
        currentPiece.y = newY;
        drawAll();
        return true;
      }
      if (dy === 1) {
        lockPiece();
        drawAll();
        if (gameOver) {
          if (gameLoopInterval) {
            clearInterval(gameLoopInterval);
            gameLoopInterval = null;
          }
        }
      }
      return false;
    }

    function rotatePiece() {
      if (paused || gameOver || !currentPiece) return;
      const shape = currentPiece.shape;
      const rotated = shape[0].map((_, idx) => shape.map(row => row[idx]).reverse());
      
      if (!collision(rotated, currentPiece.x, currentPiece.y)) {
        currentPiece.shape = rotated;
      } else {
        if (!collision(rotated, currentPiece.x - 1, currentPiece.y)) {
          currentPiece.shape = rotated;
          currentPiece.x -= 1;
        } else if (!collision(rotated, currentPiece.x + 1, currentPiece.y)) {
          currentPiece.shape = rotated;
          currentPiece.x += 1;
        } else if (!collision(rotated, currentPiece.x, currentPiece.y - 1)) {
          currentPiece.shape = rotated;
          currentPiece.y -= 1;
        }
      }
      drawAll();
    }

    function hardDrop() {
      if (paused || gameOver || !currentPiece) return;
      while (!collision(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
      }
      lockPiece();
      drawAll();
      if (gameOver) {
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
      }
    }

    // ---------- 绘制（含阴影 + 暂停覆盖层）----------
    function drawBoard() {
      ctx.clearRect(0, 0, 300, 600);
      
      // 网格
      ctx.strokeStyle = '#262e42';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * BLOCK_SIZE, 0);
        ctx.lineTo(i * BLOCK_SIZE, 600);
        ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * BLOCK_SIZE);
        ctx.lineTo(300, j * BLOCK_SIZE);
        ctx.stroke();
      }

      // 已固定的方块
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const cell = board[row][col];
          if (cell !== 0) {
            ctx.fillStyle = cell;
            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-4, 2);
          }
        }
      }

      // 幽灵阴影（仅在未暂停时显示阴影效果更自然，暂停时也可显示但无伤大雅，保持一致）
      if (currentPiece && !gameOver) {
        const ghostY = getGhostY();
        if (ghostY !== currentPiece.y) {
          const { shape, x, color } = currentPiece;
          ctx.globalAlpha = 0.4;
          for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[0].length; c++) {
              if (shape[r][c] !== 0) {
                const boardX = (x + c) * BLOCK_SIZE;
                const boardY = (ghostY + r) * BLOCK_SIZE;
                ctx.fillStyle = color;
                ctx.fillRect(boardX, boardY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(boardX, boardY, BLOCK_SIZE-1, BLOCK_SIZE-1);
              }
            }
          }
          ctx.globalAlpha = 1.0;
        }
      }

      // 当前方块 (未暂停时正常绘制，暂停时半透明展示但仍旧可看清)
      if (currentPiece && !gameOver) {
        const { shape, x, y, color } = currentPiece;
        // 暂停时当前方块稍微半透明以区分交互不可用
        if (paused) ctx.globalAlpha = 0.7;
        for (let r = 0; r < shape.length; r++) {
          for (let c = 0; c < shape[0].length; c++) {
            if (shape[r][c] !== 0) {
              const boardX = (x + c) * BLOCK_SIZE;
              const boardY = (y + r) * BLOCK_SIZE;
              ctx.fillStyle = color;
              ctx.fillRect(boardX, boardY, BLOCK_SIZE-1, BLOCK_SIZE-1);
              ctx.fillStyle = 'rgba(255,255,255,0.35)';
              ctx.fillRect(boardX, boardY, BLOCK_SIZE-8, 3);
            }
          }
        }
        ctx.globalAlpha = 1.0;
      }

      // 游戏结束遮罩
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, 300, 600);
        ctx.fillStyle = '#f2e982';
        ctx.font = 'bold 24px "Segoe UI", "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('游戏结束', 150, 300);
      }
      
      // ----- 暂停遮罩层（独立于游戏结束，优先级低于游戏结束）-----
      if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(20, 25, 45, 0.75)';
        ctx.fillRect(0, 0, 300, 600);
        ctx.fillStyle = '#ffe6b3';
        ctx.font = 'bold 26px "Segoe UI", "Courier New", monospace';
        ctx.shadowBlur = 0;
        ctx.fillText('⏸ 暂停', 150, 280);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#ccd9f0';
        ctx.fillText('按 ESC / 空格 继续', 150, 350);
      }
    }

    function drawPreview() {
      nextCtx.clearRect(0, 0, 120, 120);
      nextCtx.fillStyle = '#0a0d14';
      nextCtx.fillRect(0, 0, 120, 120);
      
      if (nextPiece) {
        const shape = nextPiece.shape;
        const color = nextPiece.color;
        const shapeCols = shape[0].length;
        const shapeRows = shape.length;
        const offsetX = (4 - shapeCols) * PREVIEW_SIZE / 2;
        const offsetY = (4 - shapeRows) * PREVIEW_SIZE / 2;
        
        for (let r = 0; r < shapeRows; r++) {
          for (let c = 0; c < shapeCols; c++) {
            if (shape[r][c] !== 0) {
              const x = offsetX + c * PREVIEW_SIZE;
              const y = offsetY + r * PREVIEW_SIZE;
              nextCtx.fillStyle = color;
              nextCtx.fillRect(x, y, PREVIEW_SIZE-2, PREVIEW_SIZE-2);
              nextCtx.fillStyle = 'rgba(255,255,255,0.3)';
              nextCtx.fillRect(x, y, PREVIEW_SIZE-6, 2);
            }
          }
        }
      }
    }

    function drawAll() {
      drawBoard();
      drawPreview();
    }

    // ---------- 游戏循环（下落）----------
    function gameTick() {
      if (!gameOver && !paused && currentPiece) {
        movePiece(0, 1);
        drawAll();
      } else if (paused) {
        // 如果处于暂停状态，什么也不做，但保持画面显示暂停层
        drawAll();
      } else if (gameOver) {
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
      }
    }

    // 重设循环时考虑暂停标记
    function restartGameLoopAfterPause() {
      if (gameLoopInterval) clearInterval(gameLoopInterval);
      if (!gameOver && !paused) {
        gameLoopInterval = setInterval(gameTick, BASE_INTERVAL);
      } else {
        gameLoopInterval = null;
      }
    }
    
    // ---------- 键盘控制 (加入空格和ESC的暂停响应)----------
    function handleKeyDown(e) {
      const key = e.key;
      // 所有功能键禁止页面滚动
      const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Escape'];
      if (controlKeys.includes(key) || key === 'Esc') {
        e.preventDefault();
      }
      
      // 游戏结束无法任何操作（除了重启按钮）, 但暂停切换也不能做
      if (gameOver) {
        // 如果游戏结束，按任何控制键无效 (但重启按钮单独工作)
        return;
      }
      
      // 单独处理 空格 和 Escape 的暂停切换 (支持空格键原有的硬降功能冲突解决)
      // 注意: 原先空格是硬降, 但是根据要求需要“空格键暂停”和“ESC键暂停”。
      // 为了兼容用户习惯，这里进行判断：当游戏未暂停时，空格优先作为硬降？需求明确指出“按按键暂停和esc键暂停功能”，且原设计中空格为硬降到底。
      // 但是为了符合题目“带我加上按按键暂停和esc键暂停功能”，同时保留原核心玩法，重新定义逻辑：
      // - ESC键: 无论何时，只要不是游戏结束，切换暂停状态。
      // - 空格键: 当游戏处于非暂停状态时，执行硬降；当游戏处于暂停状态时，空格键用于恢复游戏(同时也切换暂停)。
      // 这样既保留了硬降，又实现了空格也可暂停/恢复的便捷体验。完全符合用户预期。
      if (key === 'Escape') {
        // ESC 切换暂停
        togglePause();
        // 确保时钟同步
        restartGameLoopAfterPause();
        drawAll();
        return;
      }
      
      if (key === ' ') {
        // 空格: 暂停状态下用于恢复，非暂停状态下执行硬降
        if (paused) {
          togglePause();
          restartGameLoopAfterPause();
          drawAll();
        } else {
          hardDrop();
          drawAll();
        }
        return;
      }
      
      // 如果游戏处于暂停状态，其他操作（方向键、旋转）不应该响应，直接退出
      if (paused) {
        return;
      }
      
      // 非暂停，正常响应操作
      switch (key) {
        case 'ArrowLeft':  movePiece(-1, 0); break;
        case 'ArrowRight': movePiece(1, 0); break;
        case 'ArrowDown':  movePiece(0, 1); break;
        case 'ArrowUp':    rotatePiece(); break;
        default: return;
      }
      drawAll();
    }
    
    // 重启时完全重置暂停标志和循环
    function resetAndRestart() {
      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }
      resetPauseState();
      initGame();
    }

    // ---------- 初始化事件与启动 ----------
    window.addEventListener('keydown', handleKeyDown);
    document.getElementById('restartButton').addEventListener('click', () => {
      resetAndRestart();
    });
    
    // 额外监听keyup防止页面滚动（兼容）
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Escape' || e.key.startsWith('Arrow')) {
        e.preventDefault();
      }
    });
    
    // 开始!
    initGame();
  })();
</script>
</body>
</html>
