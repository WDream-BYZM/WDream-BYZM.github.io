<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞行棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: linear-gradient(145deg,#0b0f1c 0%,#1a1f33 100%); font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color:#e8ecf7; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .home-btn { position: fixed; top: 16px; left: 16px; z-index: 40; padding: 8px 18px; border-radius: 18px; background: rgba(21,26,44,.85); border: 1px solid rgba(255,255,255,.15); color:#e8ecf7; text-decoration:none; font-size:13px; font-weight:600; backdrop-filter: blur(6px); transition:all .25s ease; }
  .home-btn:hover { border-color: rgba(108,92,231,.6); background: rgba(108,92,231,.25); color:#fff; }

  /* 大厅 */
  #lobby { width:min(440px, 92vw); text-align:center; }
  #lobby h2 { font-size:26px; font-weight:800; margin-bottom:4px; }
  #lobby .sub { color:#8a93ab; font-size:13px; letter-spacing:3px; margin-bottom:22px; }
  .lobby-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:22px; }
  .lobby-card .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .lobby-card .row label { color:#8a93ab; font-size:14px; }
  .lobby-card .seg { display:flex; gap:8px; }
  .lobby-card .seg button { width:46px; height:38px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#e8ecf7; font-size:14px; font-weight:700; cursor:pointer; }
  .lobby-card .seg button.on { background:linear-gradient(135deg,#6c5ce7,#00d2ff); border-color:transparent; }
  .lobby-card .nm-row { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .lobby-card .nm-row input { flex:1; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); color:#e8ecf7; font-size:14px; }
  .lobby-card .start { width:100%; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg,#6c5ce7,#00d2ff); color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
  .lobby-card .start:active { transform:scale(.98); }
  .tip { margin-top:16px; color:#565d75; font-size:12px; line-height:1.9; }

  /* 对局 */
  #game { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .top-bar { display:flex; align-items:center; gap:14px; width:min(660px, 94vw); }
  .turn-badge { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .turn-badge .dot { width:14px; height:14px; border-radius:50%; }
  .dice-area { display:flex; align-items:center; gap:12px; }
  #diceBtn { padding:12px 26px; border:none; border-radius:14px; background:linear-gradient(135deg,#6c5ce7,#00d2ff); color:#fff; font-size:15px; font-weight:800; cursor:pointer; }
  #diceBtn:disabled { opacity:.4; cursor:not-allowed; }
  #diceFace { font-size:34px; width:52px; height:52px; background:#101624; border:1px solid rgba(255,255,255,.12); border-radius:14px; display:flex; align-items:center; justify-content:center; }
  #msg { font-size:13px; color:#00d2ff; font-weight:600; min-height:20px; text-align:center; }

  #board { width:min(660px, 94vw); height:auto; background:#0c0f18; border-radius:18px; box-shadow:0 14px 34px rgba(0,0,0,.6), 0 0 0 2px #2f354a; touch-action: manipulation; }

  .scores { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:min(660px,94vw); }
  .score-chip { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); font-size:12px; font-weight:700; }
  .score-chip .dot { width:10px; height:10px; border-radius:50%; }
  .score-chip.on { border-color:rgba(255,255,255,.4); }
</style>
</head>
<body>
<a class="home-btn" href="/">← 返回主页</a>

<!-- 大厅 -->
<div id="lobby">
  <h2>✈️ 飞行棋</h2>
  <div class="sub">FLYING CHESS</div>
  <div class="lobby-card">
    <div class="row">
      <label>玩家人数</label>
      <div class="seg" id="playerSeg">
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="4" class="on">4</button>
      </div>
    </div>
    <div class="nm-row">
      <input id="nameInput" maxlength="8" placeholder="你的昵称（默认：玩家1）">
    </div>
    <button class="start" id="startBtn">开始游戏</button>
  </div>
  <div class="tip">🎲 掷出 6 可起飞并再掷一次<br>踩到对方飞机可将其送回基地，率先将 4 架飞机飞入终点者获胜</div>
</div>

<!-- 对局 -->
<div id="game" style="display:none">
  <div class="top-bar">
    <div class="turn-badge"><span class="dot" id="turnDot"></span><span id="turnName">玩家</span></div>
    <div class="dice-area">
      <button id="diceBtn">🎲 掷骰子</button>
      <div id="diceFace">·</div>
    </div>
  </div>
  <canvas id="board" width="660" height="660"></canvas>
  <div id="msg"></div>
  <div class="scores" id="scores"></div>
</div>

<script>
;(function () {
  'use strict'
  // ================= 配置 =================
  var CELL = 40          // 轨道格尺寸
  var PAD = 40           // 内边距（环内侧留出终点区）
  var BOARD = 660
  var RING = 52          // 外圈总格数
  var NAMES = ['红方', '黄方', '蓝方', '绿方']
  var COLORS = ['#ff5252', '#ffd740', '#448aff', '#69f0ae']
  var playerCount = 4
  var players = []       // {name, color, ai, planes:[...]}
  var current = 0        // 当前玩家索引
  var rolling = false

  // ================= 坐标计算 =================
  // 52 格外圈：顶边0-12 右13-25 底26-38 左39-51
  var ringPts = []
  ;(function buildRing() {
    var x0 = PAD + CELL / 2, y0 = PAD + CELL / 2
    var span = RING / 4 - 1  // 每条边内部格数(不含角) = 12
    // 顶边：格0..12（左→右），格0 在左上角
    for (var i = 0; i <= 12; i++) ringPts[i] = { x: x0 + i * CELL, y: y0 }
    // 右边：格13..25（上→下），格13 右上角
    for (var j = 0; j <= 12; j++) ringPts[13 + j] = { x: BOARD - PAD - CELL / 2, y: y0 + j * CELL }
    // 底边：格26..38（右→左），格26 右下角
    for (var k = 0; k <= 12; k++) ringPts[26 + k] = { x: BOARD - PAD - CELL / 2 - k * CELL, y: BOARD - PAD - CELL / 2 }
    // 左边：格39..51（下→上），格39 左下角
    for (var m = 0; m <= 12; m++) ringPts[39 + m] = { x: x0, y: BOARD - PAD - CELL / 2 - m * CELL }
  })()

  // 玩家起点格：红0 黄13 蓝26 绿39（四角）
  // 终点滑道坐标：从角向中心延伸 4 格
  function slidePts(pi) {
    var start = ringPts[pi * 13]
    var cx = BOARD / 2, cy = BOARD / 2
    var dx = (cx - start.x) / 5, dy = (cy - start.y) / 5
    var pts = []
    for (var s = 1; s <= 5; s++) pts.push({ x: start.x + dx * s, y: start.y + dy * s })
    return pts // 前4格是滑道，第5格是终点中心
  }
  var SLIDE = [0, 1, 2, 3].map(slidePts)

  // 基地坐标：四角外侧 2x2 位置
  function basePts(pi) {
    var anchor = ringPts[pi * 13]
    // 角朝外方向
    var outX = (anchor.x - BOARD / 2) > 0 ? 1 : -1
    var outY = (anchor.y - BOARD / 2) > 0 ? 1 : -1
    var off = CELL * 0.9
    return [
      { x: anchor.x + outX * off * 0.5 - CELL * 0.28, y: anchor.y + outY * off * 0.5 - CELL * 0.28 },
      { x: anchor.x + outX * off * 0.5 + CELL * 0.28, y: anchor.y + outY * off * 0.5 - CELL * 0.28 },
      { x: anchor.x + outX * off * 0.5 - CELL * 0.28, y: anchor.y + outY * off * 0.5 + CELL * 0.28 },
      { x: anchor.x + outX * off * 0.5 + CELL * 0.28, y: anchor.y + outY * off * 0.5 + CELL * 0.28 }
    ]
  }
  var BASE = [0, 1, 2, 3].map(basePts)

  // ================= 飞机模型 =================
  // plane: { phase:'base'|'ring'|'slide'|'finish', pos, fin }
  function makePlanes() {
    var arr = []
    for (var i = 0; i < 4; i++) arr.push({ phase: 'base', pos: 0, fin: 0 })
    return arr
  }

  function newGame() {
    players = []
    for (var i = 0; i < playerCount; i++) {
      var isHuman = i === 0
      players.push({
        name: isHuman ? (nameInput.value.trim() || NAMES[i]) : NAMES[i],
        color: COLORS[i],
        ai: !isHuman,
        planes: makePlanes()
      })
    }
    current = 0
    draw()
    renderScores()
    setMsg('点击 🎲 掷骰子')
    updateTurn()
  }

  // ================= 逻辑 =================
  function distFromStart(pi, pos) {
    var S = pi * 13
    return (pos - S + RING) % RING
  }

  function planePos(p, pi) {
    if (p.phase === 'base') return BASE[pi][p.pos]
    if (p.phase === 'ring') return ringPts[p.pos]
    if (p.phase === 'slide') return SLIDE[pi][p.fin]
    return SLIDE[pi][4] // finish
  }

  // 飞机当前位置的"移动优先级"（用于 AI/选择排序）
  function planeRank(p, pi) {
    if (p.phase === 'finish') return 999
    if (p.phase === 'slide') return 100 + p.fin
    if (p.phase === 'ring') return distFromStart(pi, p.pos)
    return -1 // base
  }

  // 尝试移动：返回新状态。d=骰子点数
  function movePlane(p, pi, d) {
    if (p.phase === 'base') {
      if (d === 6) { p.phase = 'ring'; p.pos = pi * 13; return true }
      return false
    }
    if (p.phase === 'ring') {
      var dist = distFromStart(pi, p.pos)
      var d2 = dist + d
      if (d2 < RING) {
        p.pos = (pi * 13 + d2) % RING
        // 吃子检测在外部做
        return true
      } else if (d2 <= RING + 4) {
        p.phase = 'slide'
        p.fin = d2 - RING
        return true
      } else {
        return false // 步数超出，不动
      }
    }
    if (p.phase === 'slide') {
      var f = p.fin + d
      if (f === 4) { p.phase = 'finish'; return true }
      else if (f < 4) { p.fin = f; return true }
      else return false
    }
    return false
  }

  // 某个玩家的可移动飞机索引
  function movableIdx(pi, d) {
    var out = []
    players[pi].planes.forEach(function (p, idx) {
      if (p.phase === 'base' && d === 6) out.push(idx)
      else if (p.phase === 'ring' || p.phase === 'slide') {
        var tmp = { phase: p.phase, pos: p.pos, fin: p.fin }
        if (movePlane(tmp, pi, d)) out.push(idx)
      }
    })
    return out
  }

  // 吃子：落点环上有敌方飞机 → 回基地
  function eat(pi, plane) {
    if (plane.phase !== 'ring') return
    for (var q = 0; q < playerCount; q++) {
      if (q === pi) continue
      players[q].planes.forEach(function (op) {
        if (op.phase === 'ring' && op.pos === plane.pos) {
          op.phase = 'base'
          op.pos = 0
          setMsg(players[pi].name + ' 吃掉了 ' + players[q].name + ' 的飞机！')
        }
      })
    }
  }

  function checkWin(pi) {
    return players[pi].planes.every(function (p) { return p.phase === 'finish' })
  }

  // ================= 动画移动 =================
  var anim = null
  function animate(from, to, cb) {
    var t0 = performance.now()
    var dur = 160
    cancelAnimationFrame(anim)
    ;(function step(now) {
      var k = Math.min(1, (now - t0) / dur)
      var eased = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
      if (currentPlaneXY) {
        currentPlaneXY.x = from.x + (to.x - from.x) * eased
        currentPlaneXY.y = from.y + (to.y - from.y) * eased
        draw()
      }
      if (k < 1) anim = requestAnimationFrame(step)
      else { currentPlaneXY = null; draw(); cb && cb() }
    })(t0)
  }
  var currentPlaneXY = null

  // ================= 掷骰 =================
  function roll() {
    if (rolling) return
    rolling = true
    diceBtn.disabled = true
    // 骰子动画
    var spins = 0
    var iv = setInterval(function () {
      diceFace.textContent = '🎲' + (1 + Math.floor(Math.random() * 6))
      if (++spins >= 12) {
        clearInterval(iv)
        resolveRoll(1 + Math.floor(Math.random() * 6))
      }
    }, 70)
  }

  function resolveRoll(d) {
    diceFace.textContent = '⚀⚁⚂⚃⚄⚅'[d - 1]
    var pi = current
    var pl = players[pi]
    setMsg(pl.name + ' 掷出 ' + d + ' 点')

    var idxs = movableIdx(pi, d)
    if (idxs.length === 0) {
      rolling = false
      setMsg(pl.name + ' 掷出 ' + d + '，无法移动')
      endTurn()
      return
    }
    // 有 6 且基地有飞机 → 起飞
    var choose = idxs
    if (d === 6) {
      var baseOnes = idxs.filter(function (i) { return pl.planes[i].phase === 'base' })
      if (baseOnes.length) choose = baseOnes
    }
    if (choose.length === 1) {
      doMove(choose[0], d)
    } else if (pl.ai) {
      // AI：选 rank 最大的（最靠前的飞机）
      var best = choose[0]
      choose.forEach(function (i) { if (planeRank(pl.planes[i], pi) > planeRank(pl.planes[best], pi)) best = i })
      doMove(best, d)
    } else {
      // 玩家选择：高亮可移动飞机，等待点击
      selectable = choose
      setMsg('请点击要移动的飞机')
      highlightSelect = true
      draw()
      rolling = false
      diceBtn.disabled = false
    }
  }

  var selectable = []
  var highlightSelect = false

  function doMove(idx, d) {
    var pi = current
    var pl = players[pi]
    var p = pl.planes[idx]
    var from = planePos(p, pi)
    var moved = movePlane(p, pi, d)
    highlightSelect = false
    if (!moved) {
      rolling = false
      endTurn()
      return
    }
    var to = planePos(p, pi)
    currentPlane = p
    currentPlaneXY = { x: from.x, y: from.y }
    animate(from, to, function () {
      eat(pi, p)
      draw()
      renderScores()
      if (checkWin(pi)) {
        setMsg('🎉 ' + pl.name + ' 获胜！')
        rolling = false
        diceBtn.disabled = true
        setTimeout(function () {
          if (confirm(pl.name + ' 获胜！再来一局？')) { newGame() }
          else { location.reload() }
        }, 600)
        return
      }
      if (d === 6) {
        setMsg(pl.name + ' 掷出 6，再掷一次！')
        rolling = false
        diceBtn.disabled = false
      } else {
        endTurn()
      }
    })
  }

  function endTurn() {
    highlightSelect = false
    current = (current + 1) % playerCount
    updateTurn()
    rolling = false
    diceBtn.disabled = false
    if (players[current].ai) {
      setTimeout(function () {
        setMsg(players[current].name + ' 掷骰子…')
        roll()
      }, 500)
    } else {
      setMsg('轮到 ' + players[current].name + '，点击 🎲 掷骰子')
    }
  }

  function updateTurn() {
    turnDot.style.background = players[current].color
    turnName.textContent = players[current].name + (players[current].ai ? ' (AI)' : '')
    renderScores()
  }

  function setMsg(t) { msg.textContent = t }

  // ================= 绘制 =================
  var canvas = document.getElementById('board')
  var ctx = canvas.getContext('2d')
  var board, diceBtn, diceFace, msg, nameInput, scores

  function draw() {
    ctx.clearRect(0, 0, BOARD, BOARD)
    // 棋盘底色 + 中心区
    ctx.fillStyle = '#0c0f18'
    ctx.fillRect(0, 0, BOARD, BOARD)
    // 中心终点区边框
    var cx = BOARD / 2, cy = BOARD / 2
    var zone = (RING / 4 - 1) * CELL / 2 + CELL
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'
    ctx.lineWidth = 2
    ctx.strokeRect(cx - zone, cy - zone, zone * 2, zone * 2)

    // 轨道格
    for (var i = 0; i < RING; i++) {
      var p = ringPts[i]
      // 角格高亮（起点）
      var isStart = (i % 13 === 0)
      ctx.fillStyle = isStart ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)'
      ctx.fillRect(p.x - CELL / 2 + 1, p.y - CELL / 2 + 1, CELL - 2, CELL - 2)
      ctx.strokeStyle = isStart ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.07)'
      ctx.lineWidth = 1
      ctx.strokeRect(p.x - CELL / 2 + 1, p.y - CELL / 2 + 1, CELL - 2, CELL - 2)
    }
    // 滑道格
    for (var pi = 0; pi < playerCount; pi++) {
      for (var s = 0; s < 4; s++) {
        var sp = SLIDE[pi][s]
        ctx.fillStyle = hexA(COLORS[pi], 0.18)
        ctx.fillRect(sp.x - CELL / 2 + 1, sp.y - CELL / 2 + 1, CELL - 2, CELL - 2)
        ctx.strokeStyle = hexA(COLORS[pi], 0.4)
        ctx.strokeRect(sp.x - CELL / 2 + 1, sp.y - CELL / 2 + 1, CELL - 2, CELL - 2)
      }
    }
    // 终点中心
    var ep = SLIDE[0][4]
    ctx.fillStyle = 'rgba(255,255,255,0.08)'
    ctx.beginPath(); ctx.arc(ep.x, ep.y, CELL * 0.7, 0, Math.PI * 2); ctx.fill()
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'
    ctx.stroke()

    // 基地 + 飞机
    players.forEach(function (pl, pi) {
      pl.planes.forEach(function (p, idx) {
        var pos = planePos(p, pi)
        var r = CELL * 0.32
        if (currentPlaneXY && p === currentPlane && p.phase !== 'finish') {
          pos = currentPlaneXY
        }
        // 基地背景
        if (p.phase === 'base') {
          ctx.fillStyle = hexA(pl.color, 0.22)
          ctx.fillRect(BASE[pi][idx].x - r, BASE[pi][idx].y - r, r * 2, r * 2)
          ctx.strokeStyle = hexA(pl.color, 0.5)
          ctx.strokeRect(BASE[pi][idx].x - r, BASE[pi][idx].y - r, r * 2, r * 2)
        }
        // 飞机圆
        ctx.beginPath()
        ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2)
        ctx.fillStyle = pl.color
        ctx.fill()
        ctx.lineWidth = 2
        ctx.strokeStyle = '#0b0f1c'
        ctx.stroke()
        // 是否可点选高亮
        if (highlightSelect && selectable.indexOf(idx) !== -1 && pl === players[current]) {
          ctx.beginPath()
          ctx.arc(pos.x, pos.y, r + 5, 0, Math.PI * 2)
          ctx.strokeStyle = '#fff'
          ctx.lineWidth = 2
          ctx.stroke()
        }
        // 机头小三角
        ctx.beginPath()
        ctx.arc(pos.x, pos.y, r * 0.45, 0, Math.PI * 2)
        ctx.fillStyle = 'rgba(255,255,255,0.85)'
        ctx.fill()
      })
    })
  }
  var currentPlane = null

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16)
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'
  }

  function renderScores() {
    scores.innerHTML = players.map(function (p, i) {
      var done = p.planes.filter(function (x) { return x.phase === 'finish' }).length
      return '<div class="score-chip' + (i === current ? ' on' : '') + '"><span class="dot" style="background:' + p.color + '"></span>' + esc(p.name) + ' ✈' + done + '/4</div>'
    }).join('')
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML }

  // 点击选择飞机
  canvas.addEventListener('click', function (e) {
    if (!highlightSelect || rolling) return
    var rect = canvas.getBoundingClientRect()
    var scale = canvas.width / rect.width
    var mx = (e.clientX - rect.left) * scale
    var my = (e.clientY - rect.top) * scale
    var pi = current
    var best = -1, bestD = 1e9
    selectable.forEach(function (idx) {
      var pos = planePos(players[pi].planes[idx], pi)
      var d = (pos.x - mx) * (pos.x - mx) + (pos.y - my) * (pos.y - my)
      if (d < bestD) { bestD = d; best = idx }
    })
    if (best >= 0 && bestD < (CELL * 0.6) * (CELL * 0.6)) {
      rolling = true
      diceBtn.disabled = true
      var d = lastRoll
      // 重新执行移动
      doMove(best, d)
    }
  })
  var lastRoll = 1

  // ================= 事件绑定 =================
  var playerSeg = document.getElementById('playerSeg')
  playerSeg.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      playerSeg.querySelectorAll('button').forEach(function (x) { x.classList.remove('on') })
      b.classList.add('on')
      playerCount = +b.getAttribute('data-n')
    })
  })

  var startBtn = document.getElementById('startBtn')
  nameInput = document.getElementById('nameInput')
  diceBtn = document.getElementById('diceBtn')
  diceFace = document.getElementById('diceFace')
  msg = document.getElementById('msg')
  scores = document.getElementById('scores')
  var lobby = document.getElementById('lobby')
  var gameEl = document.getElementById('game')

  startBtn.addEventListener('click', function () {
    lobby.style.display = 'none'
    gameEl.style.display = 'flex'
    newGame()
  })
  diceBtn.addEventListener('click', function () {
    if (rolling) return
    lastRoll = 0
    roll()
  })

  // 修正 lastRoll（resolveRoll 里记录）
  var _resolve = resolveRoll
  resolveRoll = function (d) {
    lastRoll = d
    _resolve(d)
  }
})()
</script>
</body>
</html>
