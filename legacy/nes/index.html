<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NES 红白机">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>🕹️ NES 红白机</title>
<style>
:root{
  --surface:rgba(255,255,255,.055);
  --surface-2:rgba(255,255,255,.09);
  --surface-3:rgba(255,255,255,.14);
  --hairline:rgba(255,255,255,.12);
  --text-1:#f5f5f7;
  --text-2:#98989d;
  --text-3:#7d7d82;
  --accent:#0a84ff;
  --accent-press:#0070e0;
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  background:radial-gradient(1100px 520px at 50% -12%,#1c1c1f 0%,rgba(28,28,31,0) 62%),#000;
  color:var(--text-1);
  font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
}
::selection{background:rgba(10,132,255,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));
  background:rgba(10,10,12,.72);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:relative;z-index:50;
}
header h1{font-size:15px;font-weight:700;letter-spacing:.2px;flex:1;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:40px;padding:0 10px;
  border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--accent);
  font:600 15px inherit;cursor:pointer;
  transition:opacity .15s ease;
}
.hbtn:active{opacity:.55}
@media(hover:hover){.hbtn:hover{opacity:.85}}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;z-index:5;overflow-y:auto}
#panel.hide{display:none}
.icon-tile{
  width:60px;height:60px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 28px rgba(0,0,0,.35);
}
.tit{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--text-1)}
.sub{color:var(--text-2);font-size:14px;line-height:1.5;text-align:center;max-width:420px}
.big{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:min(360px,90vw);height:50px;padding:0 20px;
  border:none;border-radius:var(--radius);
  background:var(--accent);color:#fff;
  font:600 16px inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.35);
  transition:transform .12s ease-out,background .15s ease;
}
.big:active{background:var(--accent-press);transform:scale(.975)}
@media(hover:hover){.big:hover{background:#2b8cff}}
.roms{display:flex;flex-direction:column;gap:8px;width:min(360px,90vw)}
.rom{
  display:flex;align-items:center;gap:12px;
  width:100%;min-height:48px;padding:0 16px;
  border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--hairline);
  color:var(--text-1);font:500 15px inherit;text-align:left;cursor:pointer;
  transition:background .15s ease,transform .12s ease-out;
}
.rom:active{background:var(--surface-3);transform:scale(.985)}
@media(hover:hover){.rom:hover{background:var(--surface-2)}}
.rom .r-chev{margin-left:auto;color:var(--text-3);font-size:19px;line-height:1}
.hint{color:var(--text-3);font-size:12.5px;text-align:center;max-width:440px;line-height:1.8}
.hint code{background:rgba(255,255,255,.09);padding:2px 6px;border-radius:5px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d8d8dc}
#game{flex:1;min-height:0;position:relative;display:none}
#game.on{display:block}
#status{
  position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,30,.92);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 28px rgba(0,0,0,.4);
  color:var(--text-1);padding:10px 18px;border-radius:999px;
  font:500 13px inherit;white-space:nowrap;
  z-index:60;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .35s cubic-bezier(.2,.9,.3,1);
}
#status.on{opacity:1;transform:translateX(-50%) translateY(0)}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:40;color:#ff453a;font-size:14px;line-height:2}
#err.on{display:flex}
@keyframes rise-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:no-preference){
  #panel{animation:rise-in .55s cubic-bezier(.2,.8,.3,1) both}
}
@media(prefers-reduced-motion:reduce){
  *,:focus-visible{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  #panel{animation:fade-in .2s ease both}
}
@media(min-width:801px){header h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <button class="hbtn" onclick="goBack()" aria-label="返回上一页">‹ 返回</button>
  <h1>🕹️ NES 红白机</h1>
  <button class="hbtn" id="switchBtn" style="display:none" onclick="location.reload()">换游戏</button>
</header>
<main>
  <div id="err">模拟器加载失败<br>请检查网络（需访问模拟器 CDN）</div>
  <div id="panel">
    <div class="icon-tile">🕹️</div>
    <div class="tit">NES 红白机</div>
    <div class="sub">在浏览器里运行红白机（FC / NES）游戏</div>
    <button class="big" onclick="pickFile()">📂 选择 .nes 游戏文件</button>
    <div id="roms" class="roms"></div>
    <div class="hint">💡 把 .nes 文件放进本站 <code>legacy/nes/roms/</code> 目录后，
    在页面 JS 的 <code>ROM_LIST</code> 里加一行即可点击游玩；
    也可以直接「选择游戏文件」从电脑本地载入，无需上传。</div>
  </div>
  <div id="game"></div>
</main>
<div id="status" role="status" aria-live="polite">加载中…</div>
<input type="file" id="file" accept=".nes" hidden>

<script>
/* ===== 可配置 ROM 列表：把 .nes 放进 roms/ 目录后在此添加 ===== */
var ROM_LIST = [
  { name: '🎮 Demo 测试 ROM', url: 'roms/demo.nes' }
  // 例如：
  // { name: '🏷️ 我的游戏', url: 'roms/我的游戏.nes' }
];

/* ===== EmulatorJS 全局配置（必须在 loader 加载前设置） ===== */
window.EJS_player = '#game';
window.EJS_core = 'nes';
window.EJS_language = 'zh-CN';
window.EJS_startOnLoaded = false;
window.EJS_noAutoFocus = false;
window.EJS_gameName = 'NES';

/* ===== 多 CDN 加载 loader（国内网络容灾） ===== */
var CDNS = [
  { data: 'https://cdn.emulatorjs.org/stable/data/', loader: 'https://cdn.emulatorjs.org/stable/data/loader.js' },
  { data: 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/', loader: 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js' }
];

function goBack(){ if (document.referrer) history.back(); else location.href = '../../index.html'; }
function setStatus(m, keep){ var s=document.getElementById('status'); s.textContent=m; s.className='on'; if(!keep){ clearTimeout(setStatus._t); setStatus._t=setTimeout(function(){ s.className=''; }, 2000); } }

function loadEmu(i){
  if (i >= CDNS.length) { document.getElementById('err').className='on'; return; }
  window.EJS_pathtodata = CDNS[i].data;
  var s = document.createElement('script');
  s.src = CDNS[i].loader;
  s.onerror = function(){ loadEmu(i+1); };
  document.head.appendChild(s);
}

/* ===== EmulatorJS 事件 ===== */
window.EJS_ready = function(){
  setStatus('模拟器就绪 ✓');
  renderRoms();
};

window.EJS_onGameStart = function(){
  document.getElementById('panel').className = 'hide';
  document.getElementById('game').className = 'on';
  document.getElementById('switchBtn').style.display = '';
  document.getElementById('status').className = '';
};

/* ===== ROM 选择与启动 ===== */
function renderRoms(){
  var box = document.getElementById('roms');
  if (!ROM_LIST.length) return;
  var html = '';
  for (var i=0;i<ROM_LIST.length;i++){
    (function(rom){
      html += '<button class="rom" onclick="startGame(\''+rom.url.replace(/'/g,"\\'")+'\',\''+rom.name.replace(/'/g,"\\'")+'\')">'
            + '<span>'+rom.name+'</span><span class="r-chev">›</span></button>';
    })(ROM_LIST[i]);
  }
  box.innerHTML = html;
}

function pickFile(){ document.getElementById('file').click(); }
document.getElementById('file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var url = URL.createObjectURL(f);
  setStatus('加载 '+f.name+' …', true);
  startGame(url, f.name);
  e.target.value = '';
});

function startGame(url, name){
  if (!window.EJS_emulator) { setStatus('模拟器尚未就绪，请稍候再试'); return; }
  window.EJS_gameUrl = url;
  window.EJS_gameName = name || 'NES';
  window.EJS_emulator.config.gameUrl = url;
  window.EJS_emulator.config.gameName = name || 'NES';
  setStatus('正在加载游戏…', true);
  // EmulatorJS 官方启动入口：startButtonClicked → 下载核心 → 下载 ROM → 运行
  var dummy = { preventDefault: function(){}, target: { remove: function(){} } };
  window.EJS_emulator.startButtonClicked(dummy);
}

loadEmu(0);
</script>
</body>
</html>
