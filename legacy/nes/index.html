<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NES 红白机">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>🕹️ NES 红白机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1f33 0%,#0b0f1c 55%);color:#e8ecf7;font:14px/1.5 'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(11,15,28,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08);z-index:50}
header h1{font-size:16px;font-weight:700;letter-spacing:1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{padding:8px 14px;border:none;border-radius:9px;font:600 13px inherit;cursor:pointer;min-height:36px;color:#e8ecf7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.hbtn.primary{background:linear-gradient(135deg,#6c5ce7,#00d2ff);border:none;color:#fff;box-shadow:0 3px 12px rgba(108,92,231,.35)}
.hbtn:active{transform:scale(.97)}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:5;overflow-y:auto}
#panel.hide{display:none}
.emoji{font-size:52px}
.tit{font-size:20px;font-weight:800;background:linear-gradient(90deg,#6c5ce7,#00d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8a93ab;font-size:13px;text-align:center;max-width:420px}
.big{width:min(360px,90vw);padding:16px;border:none;border-radius:14px;font:700 15px inherit;cursor:pointer;min-height:52px;color:#fff;background:linear-gradient(135deg,#6c5ce7,#00d2ff);box-shadow:0 6px 20px rgba(108,92,231,.4)}
.big:active{transform:scale(.98)}
.roms{display:flex;flex-direction:column;gap:8px;width:min(360px,90vw)}
.rom{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);cursor:pointer;color:#e8ecf7;font:600 14px inherit;text-align:left}
.rom:active{background:rgba(255,255,255,.09)}
.rom .r-arrow{margin-left:auto;color:#00d2ff}
.hint{color:#5b6378;font-size:12px;text-align:center;max-width:440px;line-height:1.8}
.hint code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px;color:#a29bfe}
#game{flex:1;min-height:0;position:relative;display:none}
#game.on{display:block}
#status{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(21,26,44,.92);border:1px solid rgba(255,255,255,.12);color:#e8ecf7;padding:8px 16px;border-radius:8px;font-size:12px;z-index:60;display:none;backdrop-filter:blur(6px);white-space:nowrap}
#status.on{display:block}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:40;color:#ff6b6b;font-size:14px;line-height:2}
#err.on{display:flex}
@media(min-width:801px){ header h1{font-size:18px} }
</style>
</head>
<body>
<header>
  <button class="hbtn" onclick="goBack()">← 返回</button>
  <h1>🕹️ NES 红白机</h1>
  <button class="hbtn primary" id="switchBtn" style="display:none" onclick="location.reload()">🔁 换游戏</button>
</header>
<main>
  <div id="err">模拟器加载失败<br>请检查网络（需访问模拟器 CDN）</div>
  <div id="panel">
    <div class="emoji">🕹️</div>
    <div class="tit">NES 红白机</div>
    <div class="sub">在浏览器里运行红白机（FC / NES）游戏</div>
    <button class="big" onclick="pickFile()">📂 选择 .nes 游戏文件</button>
    <div id="roms" class="roms"></div>
    <div class="hint">💡 把 .nes 文件放进本站 <code>legacy/nes/roms/</code> 目录后，
    在页面 JS 的 <code>ROM_LIST</code> 里加一行即可点击游玩；
    也可以直接「选择游戏文件」从电脑本地载入，无需上传。</div>
  </div>
  <div id="game"></div>
</main>
<div id="status">加载中…</div>
<input type="file" id="file" accept=".nes" hidden>

<script>
/* ===== 可配置 ROM 列表：把 .nes 放进 roms/ 目录后在此添加 ===== */
var ROM_LIST = [
  { name: '🎮 Demo 测试 ROM', url: 'roms/demo.nes' }
  // 例如：
  // { name: '🏷️ 我的游戏', url: 'roms/我的游戏.nes' }
];

/* ===== EmulatorJS 全局配置（必须在 loader 加载前设置） ===== */
window.EJS_player = '#game';
window.EJS_core = 'nes';
window.EJS_language = 'zh-CN';
window.EJS_startOnLoaded = false;
window.EJS_noAutoFocus = false;
window.EJS_gameName = 'NES';

/* ===== 多 CDN 加载 loader（国内网络容灾） ===== */
var CDNS = [
  { data: 'https://cdn.emulatorjs.org/stable/data/', loader: 'https://cdn.emulatorjs.org/stable/data/loader.js' },
  { data: 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/', loader: 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js' }
];

function goBack(){ if (document.referrer) history.back(); else location.href = '../../index.html'; }
function setStatus(m, keep){ var s=document.getElementById('status'); s.textContent=m; s.className='on'; if(!keep){ clearTimeout(setStatus._t); setStatus._t=setTimeout(function(){ s.className=''; }, 2000); } }

function loadEmu(i){
  if (i >= CDNS.length) { document.getElementById('err').className='on'; return; }
  window.EJS_pathtodata = CDNS[i].data;
  var s = document.createElement('script');
  s.src = CDNS[i].loader;
  s.onerror = function(){ loadEmu(i+1); };
  document.head.appendChild(s);
}

/* ===== EmulatorJS 事件 ===== */
window.EJS_ready = function(){
  setStatus('模拟器就绪 ✓');
  renderRoms();
};

window.EJS_onGameStart = function(){
  document.getElementById('panel').className = 'hide';
  document.getElementById('game').className = 'on';
  document.getElementById('switchBtn').style.display = '';
  document.getElementById('status').className = '';
};

/* ===== ROM 选择与启动 ===== */
function renderRoms(){
  var box = document.getElementById('roms');
  if (!ROM_LIST.length) return;
  var html = '';
  for (var i=0;i<ROM_LIST.length;i++){
    (function(rom){
      html += '<button class="rom" onclick="startGame(\''+rom.url.replace(/'/g,"\\'")+'\',\''+rom.name.replace(/'/g,"\\'")+'\')">'
            + '<span>'+rom.name+'</span><span class="r-arrow">▶</span></button>';
    })(ROM_LIST[i]);
  }
  box.innerHTML = html;
}

function pickFile(){ document.getElementById('file').click(); }
document.getElementById('file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var url = URL.createObjectURL(f);
  setStatus('加载 '+f.name+' …', true);
  startGame(url, f.name);
  e.target.value = '';
});

function startGame(url, name){
  if (!window.EJS_emulator) { setStatus('模拟器尚未就绪，请稍候再试'); return; }
  window.EJS_gameUrl = url;
  window.EJS_gameName = name || 'NES';
  window.EJS_emulator.config.gameUrl = url;
  window.EJS_emulator.config.gameName = name || 'NES';
  setStatus('正在加载游戏…', true);
  // EmulatorJS 官方启动入口：startButtonClicked → 下载核心 → 下载 ROM → 运行
  var dummy = { preventDefault: function(){}, target: { remove: function(){} } };
  window.EJS_emulator.startButtonClicked(dummy);
}

loadEmu(0);
</script>
</body>
</html>
