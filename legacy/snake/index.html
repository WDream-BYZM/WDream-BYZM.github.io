<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  .home-btn { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 30; padding: 9px 16px; border-radius: 999px; background: rgba(28,28,30,.72); border: 1px solid rgba(255,255,255,.12); color: #0a84ff; text-decoration: none; font-size: 14px; font-weight: 600; font-family: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',system-ui,sans-serif; -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); transition: opacity .15s ease; }
  .home-btn:active { opacity: .55; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: radial-gradient(1000px 500px at 50% -10%,#1d1d20 0%,rgba(29,29,32,0) 60%),#000; font-family: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px; }
  .score { color: #98989d; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .score span { color: #f5f5f7; font-size: 30px; margin-left: 8px; }
  canvas { background: #0a0a0c; border-radius: 16px; box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.14); display: block; max-width: 92vw; height: auto; }
  .controls { display: flex; gap: 10px; margin-top: 6px; }
  .btn { padding: 12px 26px; border: none; border-radius: 12px; background: #0a84ff; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(10,132,255,.3); transition: transform .12s ease-out, background .15s ease; }
  .btn:active { transform: scale(.97); background: #0070e0; }
  .pad { display: grid; grid-template-columns: repeat(3,54px); grid-template-rows: repeat(2,54px); gap: 6px; margin-top: 10px; }
  .pad button { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #f5f5f7; font-size: 22px; border-radius: 10px; cursor: pointer; transition: background .15s ease; }
  .pad button:active { background: rgba(255,255,255,.16); }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.72); z-index: 20; }
  #overlay.show { display: flex; }
  .card { background: #1c1c1e; padding: 40px 56px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .card h2 { color: #fff; font-size: 30px; margin-bottom: 10px; }
  .card p { color: #98989d; font-size: 18px; margin-bottom: 26px; }
  @media (hover: none) { .pad { display: grid; } }
  @media (hover: hover) and (min-width: 700px) { .pad { display: none; } }
</style>
</head>
<body>
<a class="home-btn" href="/">← 返回主页</a>
<div class="wrap">
  <div class="score">得分 <span id="score">0</span></div>
  <canvas id="game"></canvas>
  <div class="controls">
    <button class="btn" id="restart">重新开始</button>
  </div>
  <div class="pad">
    <button class="up">▲</button>
    <button class="left">◀</button>
    <button class="down">▼</button>
    <button class="right">▶</button>
  </div>
</div>
<div id="overlay">
  <div class="card">
    <h2>游戏结束</h2>
    <p>得分 <b id="final" style="color:#0a84ff">0</b></p>
    <button class="btn" id="again">再来一局</button>
  </div>
</div>
<script>
(function () {
  'use strict'
  var canvas = document.getElementById('game')
  var ctx = canvas.getContext('2d')
  var COLS = 20, ROWS = 20, CELL = 22
  canvas.width = COLS * CELL
  canvas.height = ROWS * CELL

  var snake, dir, nextDir, food, score, speed, timer, dead

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]
    dir = { x: 1, y: 0 }
    nextDir = { x: 1, y: 0 }
    score = 0
    speed = 160
    dead = false
    spawnFood()
    updateScore()
    document.getElementById('overlay').classList.remove('show')
    clearInterval(timer)
    timer = setInterval(step, speed)
    draw()
  }

  function spawnFood() {
    while (true) {
      var fx = Math.floor(Math.random() * COLS)
      var fy = Math.floor(Math.random() * ROWS)
      if (!snake.some(function (s) { return s.x === fx && s.y === fy })) {
        food = { x: fx, y: fy }
        return
      }
    }
  }

  function step() {
    if (dead) return
    dir = nextDir
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y }
    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { return gameOver() }
    // 撞自己
    if (snake.some(function (s) { return s.x === head.x && s.y === head.y })) { return gameOver() }
    snake.unshift(head)
    if (head.x === food.x && head.y === food.y) {
      score += 10
      updateScore()
      spawnFood()
      if (speed > 70) { speed -= 6; clearInterval(timer); timer = setInterval(step, speed) }
    } else {
      snake.pop()
    }
    draw()
  }

  function setDir(x, y) {
    // 禁止反向
    if (dir.x !== -x || dir.y !== -y) nextDir = { x: x, y: y }
  }

  function gameOver() {
    dead = true
    clearInterval(timer)
    document.getElementById('final').textContent = score
    document.getElementById('overlay').classList.add('show')
  }

  function updateScore() { document.getElementById('score').textContent = score }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'
    for (var i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke() }
    for (var j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke() }
    // 食物
    ctx.fillStyle = '#ff453a'
    ctx.beginPath()
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2)
    ctx.fill()
    // 蛇
    snake.forEach(function (s, idx) {
      var g = ctx.createLinearGradient(s.x * CELL, s.y * CELL, s.x * CELL + CELL, s.y * CELL + CELL)
      g.addColorStop(0, '#5ea5ff')
      g.addColorStop(1, '#0a84ff')
      ctx.fillStyle = idx === 0 ? '#ffffff' : g
      var pad = idx === 0 ? 2 : 3
      ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2)
    })
  }

  // 键盘
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { e.preventDefault(); setDir(0, -1) }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setDir(0, 1) }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setDir(-1, 0) }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setDir(1, 0) }
  })

  // 触屏按钮
  document.querySelector('.pad .up').addEventListener('click', function () { setDir(0, -1) })
  document.querySelector('.pad .down').addEventListener('click', function () { setDir(0, 1) })
  document.querySelector('.pad .left').addEventListener('click', function () { setDir(-1, 0) })
  document.querySelector('.pad .right').addEventListener('click', function () { setDir(1, 0) })
  // 触屏滑动
  var tx = 0, ty = 0
  canvas.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true })
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault()
    var dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0)
    else if (dy !== 0) setDir(0, dy > 0 ? 1 : -1)
    tx = e.touches[0].clientX; ty = e.touches[0].clientY
  }, { passive: false })

  document.getElementById('restart').addEventListener('click', reset)
  document.getElementById('again').addEventListener('click', reset)
  reset()
})()
</script>
</body>
</html>
