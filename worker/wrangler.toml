# BYZM 联机对战 —— Cloudflare Worker 部署配置
# 部署：npm i -g wrangler && wrangler deploy
name = "byzm-multi"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 自定义域名路由（multi.byzmovo.cn 直连联机服务器，无需 VPN）
[[routes]]
pattern = "multi.byzmovo.cn"
custom_domain = true

# Durable Objects 绑定（房间管理 + 房间登记中心）
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

